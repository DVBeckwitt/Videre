name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  release-script:
    name: release script safety tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows release script
        shell: pwsh
        run: ./tools/build_android_release.Tests.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test APK signing identity verification
        run: python -m unittest discover -s tools -p test_apk_signing.py -v

  build:
    name: flutter analyze and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adopt'
      - uses: cachix/install-nix-action@v22
        with:
          nix_path: nixpkgs=channel:nixos-23.11
      - run: git submodule init
      - run: git submodule update
      - run: ./submodules/flutter/bin/flutter doctor
      - run: ./submodules/flutter/bin/flutter config --no-analytics
      - run: ./submodules/flutter/bin/flutter pub get
      - name: Test validation helper
        run: ./submodules/flutter/bin/dart tools/validate_test.dart
      - name: Check formatting
        run: ./submodules/flutter/bin/dart tools/validate.dart format
      - name: Analyze source and regression tests
        run: ./submodules/flutter/bin/dart tools/validate.dart analyze
      - name: Run offline regression tests
        run: ./submodules/flutter/bin/dart tools/validate.dart test
      - run: ./submodules/flutter/bin/flutter pub run flutter_native_splash:create
      - run: ./submodules/flutter/bin/flutter build apk --profile --split-per-abi
      - name: Test native SOCKS transport
        working-directory: android
        run: ./gradlew :videre_proxy:testDebugUnitTest
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/flutter-apk
