name: Release

permissions:
  contents: write

on:
  push:
    tags:
     - '*'

  workflow_dispatch:

env:
  ANDROID_KEY_FILE: /tmp/key.properties

jobs:
  build:
    name: flutter release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adopt'
      - uses: cachix/install-nix-action@v22
        with:
          nix_path: nixpkgs=channel:nixos-23.11
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
          printf 'storeFile=/tmp/keystore.jks\n' > "$ANDROID_KEY_FILE"
          printf 'storePassword=%s\n' "$STORE_PASSWORD" >> "$ANDROID_KEY_FILE"
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> "$ANDROID_KEY_FILE"
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> "$ANDROID_KEY_FILE"
          printf '%s' "$STORE_PASSWORD" > /tmp/store-password.txt
          printf '%s' "$KEY_PASSWORD" > /tmp/key-password.txt
      - run: git submodule init
      - run: git submodule update
      - run: cp -R ./ /tmp/build
      - name: Build app
        working-directory: /tmp/build
        run: |
          git submodule init
          git submodule update
          export PUB_CACHE=$(pwd)/.pub-cache
          ./submodules/flutter/bin/flutter doctor
          ./submodules/flutter/bin/flutter config --no-analytics
          ./submodules/flutter/bin/flutter pub get
          ./submodules/flutter/bin/flutter pub run flutter_native_splash:create
          ./submodules/flutter/bin/flutter build apk --split-per-abi
          ./submodules/flutter/bin/flutter build apk
          ./submodules/flutter/bin/flutter build appbundle
      - name: Moving build artifacts
        run: | 
          mkdir -p build/app/outputs/flutter-apk
          mkdir -p build/app/outputs/bundle/release
          cp /tmp/build/build/app/outputs/flutter-apk/* build/app/outputs/flutter-apk/
          cp /tmp/build/build/app/outputs/bundle/release/* build/app/outputs/bundle/release/
      - name: Save APKs for device testing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: videre-apks
          path: build/app/outputs/flutter-apk/*.apk
      - name: Create apks file for accrescent
        env:
          BUNDLETOOL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: nix-shell nix/bundletool.nix --run 'bundletool build-apks --bundle=build/app/outputs/bundle/release/app-release.aab --output=build/app/outputs/bundle/release/app-release.apks --ks-pass=file:/tmp/store-password.txt --ks=/tmp/keystore.jks --ks-key-alias="$BUNDLETOOL_KEY_ALIAS" --key-pass=file:/tmp/key-password.txt --aapt2=$(which aapt2)'
      - run: ls build/app/outputs/flutter-apk/
      - run: ls build/app/outputs/bundle/release/
      - name: Prepare release assets
        run: |
          rm -rf build/release-assets
          mkdir -p build/release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/bundle/release/app-release.apks \
            build/release-assets/
          git archive --format=zip --output=build/release-assets/source-code.zip HEAD
          git archive --format=tar.gz --output=build/release-assets/source-code.tar.gz HEAD
          cd build/release-assets
          sha256sum *.apk *.aab *.apks source-code.zip source-code.tar.gz > SHA256SUMS
      - name: Verify release APKs
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          expected_name=${version%+*}
          expected_code=${version##*+}
          [[ "$version" == *+* && "$expected_code" =~ ^[0-9]+$ ]]
          for apk in build/release-assets/*.apk; do
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            badging=$("$build_tools/aapt" dump badging "$apk")
            package_line=${badging%%$'\n'*}
            echo "$package_line"
            if [[ "$package_line" != *"versionName='$expected_name'"* ||
                  "$package_line" != *"versionCode='$expected_code'"* ]]; then
              echo "Unexpected APK version: $apk" >&2
              exit 1
            fi
          done
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi

          release_args=(--verify-tag --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest)
          fi

          notes_file="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -f "$notes_file" ]]; then
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
          fi

          gh release create "$GITHUB_REF_NAME" \
            build/release-assets/* \
            "${release_args[@]}"
