group 'com.github.dvbeckwitt.videre.proxy'
version '0.1.0'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.github.dvbeckwitt.videre.proxy'
    compileSdk 36

    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
    }
}

dependencies {
    api 'androidx.media3:media3-common:1.4.1'
    api 'androidx.media3:media3-datasource:1.4.1'
    api 'androidx.media3:media3-datasource-okhttp:1.4.1'
    implementation 'androidx.media3:media3-database:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    api 'androidx.media3:media3-exoplayer:1.4.1'
    androidTestImplementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    androidTestImplementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
}

// Only the instrumentation package trusts these two synthetic TLS endpoints.
// Its server key is generated under build/ and never enters app assets.
abstract class GenerateCompanionFixtureTls extends DefaultTask {
    @OutputDirectory abstract DirectoryProperty getAssetsDir()
    @OutputDirectory abstract DirectoryProperty getResourcesDir()

    @TaskAction
    void generate() {
        def store = assetsDir.file('companion_fixture.p12').get().asFile
        def cert = resourcesDir.file('raw/companion_fixture_cert.der').get().asFile
        store.parentFile.mkdirs()
        cert.parentFile.mkdirs()
        if (store.exists() && !store.delete()) throw new GradleException('Cannot refresh the test TLS fixture')
        def jdkBin = new File(System.getProperty('java.home'), 'bin')
        def keytool = new File(jdkBin, 'keytool.exe')
        if (!keytool.exists()) keytool = new File(jdkBin, 'keytool')
        def common = ['-keystore', store, '-storetype', 'PKCS12', '-storepass', 'fixture', '-alias', 'fixture']
        project.exec {
            commandLine([keytool, '-J-Dkeystore.pkcs12.legacy', '-genkeypair', '-keyalg', 'RSA',
                         '-validity', '3650', '-dname', 'CN=videre-playback.invalid',
                         '-ext', 'SAN=dns:videre-playback.invalid,dns:videre-segments.invalid'] + common)
        }
        project.exec { commandLine([keytool, '-exportcert', '-file', cert] + common) }
    }
}

androidComponents.onVariants(androidComponents.selector().withBuildType('debug')) { variant ->
    if (variant.androidTest != null) {
        def tls = tasks.register("generate${variant.name.capitalize()}CompanionFixtureTls", GenerateCompanionFixtureTls)
        variant.androidTest.sources.assets.addGeneratedSourceDirectory(tls) { it.assetsDir }
        variant.androidTest.sources.res.addGeneratedSourceDirectory(tls) { it.resourcesDir }
    }
}
