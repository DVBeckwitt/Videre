group 'com.github.dvbeckwitt.videre.proxy'
version '0.1.0'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.github.dvbeckwitt.videre.proxy'
    compileSdk 36

    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
    }
}

dependencies {
    api 'androidx.media3:media3-datasource:1.4.1'
    api 'androidx.media3:media3-datasource-okhttp:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.media3:media3-exoplayer:1.4.1'
    androidTestImplementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    androidTestImplementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
}
