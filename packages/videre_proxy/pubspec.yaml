name: videre_proxy
description: Shared SOCKS5 transport policy for Videre's Android media players.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.github.dvbeckwitt.videre.proxy
        pluginClass: VidereProxyPlugin
