plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0')
def keyFile = System.getenv().getOrDefault('ANDROID_KEY_FILE', '/home/gz/dev/android/keys/key.properties')

def buildNumber = localProperties.getProperty('flutter.versionCode', '1').toInteger()
println "${flutterVersionName}:${buildNumber}"

def keystoreProperties = new Properties()
def keystorePropertiesFile = file(keyFile)
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 36

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility 21
        targetCompatibility 21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    lintOptions {
        checkReleaseBuilds false
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.github.dvbeckwitt.videre"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode buildNumber
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.github.dvbeckwitt.videre'
}

dependencies {
    implementation 'androidx.media3:media3-extractor:1.4.1'
    // Keep this in step with the pinned audio_service Android dependency.
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}

flutter {
    source '../..'
}

// This dependency declares a test fixture as an asset; no application code uses it.
// Keep profile packaging aligned with release for representative size measurements.
tasks.withType(Copy).configureEach {
    if (name in ['copyFlutterAssetsRelease', 'copyFlutterAssetsProfile']) {
        exclude 'flutter_assets/packages/awesome_notifications/test/assets/images/test_image.png'
    }
}

// Let users switch between universal and smaller APKs when updating.
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        output.versionCodeOverride = variant.versionCode
    }
}
